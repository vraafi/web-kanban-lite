<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Lite</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main>
<h1>Kanban Lite</h1>
<p class="hint">Tambah kartu, geser antar kolom, atau hapus. Data tersimpan otomatis di perangkat ini.</p>
<form id="add-form" class="add-form" autocomplete="off">
<label for="card-input" class="sr-label">Teks kartu baru</label>
<input id="card-input" type="text" placeholder="Tulis kartu baru..." maxlength="200" required>
<button type="submit" class="btn btn-primary">Tambah Kartu</button>
</form>
<div id="board" class="board">
  <section class="column" data-col="todo" aria-labelledby="h-todo">
    <h2 id="h-todo">Akan Dikerjakan</h2>
    <ul class="cards" id="list-todo"></ul>
  </section>
  <section class="column" data-col="doing" aria-labelledby="h-doing">
    <h2 id="h-doing">Sedang Dikerjakan</h2>
    <ul class="cards" id="list-doing"></ul>
  </section>
  <section class="column" data-col="done" aria-labelledby="h-done">
    <h2 id="h-done">Selesai</h2>
    <ul class="cards" id="list-done"></ul>
  </section>
</div>
<p id="status" class="status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
