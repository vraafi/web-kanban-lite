<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Lite</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Kanban Lite</h1>
      <button id="open-add-modal-btn" class="btn-primary" type="button">Tambah Kartu</button>
    </header>

    <div id="add-modal" class="modal" hidden>
      <div class="modal-content">
        <h2>Tambah Kartu Baru</h2>
        <form id="add-card-form">
          <div class="form-group">
            <label for="card-title">Judul Kartu</label>
            <input type="text" id="card-title" required placeholder="Masukkan judul..." maxlength="100">
          </div>
          <div class="form-group">
            <label for="card-desc">Deskripsi</label>
            <textarea id="card-desc" rows="3" placeholder="Masukkan deskripsi (opsional)..."></
